<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>AI Usage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div id="updateBanner" class="update-banner" hidden>
      <button id="updateLink" class="update-link"></button>
      <button id="updateDismiss" class="update-dismiss" title="Dismiss" aria-label="Dismiss">&times;</button>
    </div>
    <header class="titlebar">
      <div class="title"><svg class="logo" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7C6CFF"/>
              <stop offset="1" stop-color="#3B2DB8"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
          <path d="M8 10h16M8 16h11M8 22h14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
        </svg><span class="title-text">AI Usage</span></div>
      <div class="win-actions">
        <button id="btnRefresh" class="icon-btn" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.1"/><path d="M13.5 2.5v3h-3"/></svg>
        </button>
        <button id="btnSettings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        </button>
        <button id="btnMin" class="icon-btn" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 8h9"/></svg>
        </button>
        <button id="btnClose" class="icon-btn" title="Hide to tray" aria-label="Hide to tray">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>

    <main id="main" class="main">
      <section id="viewSetup" class="view" hidden>
        <h2>Which AI tools do you use?</h2>
        <p class="muted">Pick the ones to track. You'll be asked to sign in to each one.</p>
        <div id="setupList" class="setup-list"></div>
        <button id="btnSetupContinue" class="btn primary" disabled>Continue</button>
      </section>

      <section id="viewCards" class="view" hidden>
        <div id="cards" class="cards"></div>
      </section>
    </main>

    <section id="settings" class="settings" hidden>
      <div class="settings-head">
        <button id="btnBack" class="icon-btn" title="Back" aria-label="Back">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8 10 12.5"/></svg>
        </button>
        <h2>Settings</h2>
      </div>

      <div class="label">AI TOOLS</div>
      <div id="providerSettings"></div>

      <div class="label section">DISPLAY</div>
      <div class="row"><label for="setAutoShow">Weekly meters auto-appear at</label>
        <span class="num"><input id="setAutoShow" type="number" min="10" max="99" step="1"> %</span>
      </div>
      <div class="row"><label for="setWarn">Warn at</label>
        <span class="num"><input id="setWarn" type="number" min="10" max="98" step="1"> %</span>
      </div>
      <div class="row"><label for="setDanger">Danger at</label>
        <span class="num"><input id="setDanger" type="number" min="11" max="99" step="1"> %</span>
      </div>
      <div class="row"><label for="setPoll">Auto-refresh</label>
        <select id="setPoll">
          <option value="15">Every 15s</option>
          <option value="30">Every 30s</option>
          <option value="60">Every 1 min</option>
          <option value="120">Every 2 min</option>
          <option value="300">Every 5 min</option>
        </select>
      </div>
      <div class="row"><label for="setTheme">Theme</label>
        <select id="setTheme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="row"><label for="setTime">Time format</label>
        <select id="setTime">
          <option value="12h">12-hour</option>
          <option value="24h">24-hour</option>
        </select>
      </div>
      <div class="row"><label for="setTray">Tray icon</label>
        <select id="setTray"></select>
      </div>
      <label class="check"><input type="checkbox" id="setTop"> Always on top</label>
      <label class="check"><input type="checkbox" id="setCompact"> Compact mode</label>
      <label class="check"><input type="checkbox" id="setStartup"><span><span id="startupLabel">Start with Windows</span> <span id="startupNote" class="muted note"></span></span></label>

      <div class="about">
        <div class="label">ABOUT</div>
        <div class="about-line">
          <span>AI Usage Widget <span id="version" class="muted"></span></span>
          <button id="updateStatus" class="update-status muted" disabled></button>
        </div>
        <div class="muted">Developed by Downing-labs 2026</div>
        <div class="row-buttons about-buttons">
          <button id="btnKofi" class="btn kofi">&#9749; Support on Ko-fi</button>
          <button id="btnGithub" class="btn small">GitHub</button>
        </div>
      </div>

      <div class="settings-foot">
        <button id="btnLogs" class="btn small">Open logs folder</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
